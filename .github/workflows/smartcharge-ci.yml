name: SmartCharge CI

on:
  push:
    branches: ['feature/**', 'develop']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify without version bump
        run: npm run verify
      - name: Validate all bundles and create release manifest
        run: node scripts/release-artifact.js create
      - name: Prove repeat builds are identical
        run: |
          npm run build:homey -- --reuse-version
          node scripts/release-artifact.js create
          git diff --exit-code
      - name: Upload immutable release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: smartcharge-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/release/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
